user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log crit;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    sendfile on;
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 10m;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location = /health { include /etc/nginx/monid-proxy.conf; }
        location = /catalog { include /etc/nginx/monid-proxy.conf; }
        location / {
            if (-f /etc/monid/standby) { return 503; }
            include /etc/nginx/monid-proxy.conf;
        }
    }
}
